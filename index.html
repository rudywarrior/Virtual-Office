<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Virtual Office Demo</title>
<style>
  body {
    margin: 0;
    background: #2b2b2b;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #e8dcc8;
  }
  h1 { font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; }

  /* ===== 上部ボタン ===== */
  .buttons { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #8b5e3c;
    color: #fdf8f0;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
  }
  button:hover { background: #a9744f; }
  button.work { background: #4d6f80; }
  button.work:hover { background: #5f8aa0; }

  /* ===== シーン全体 ===== */
  #scene {
    position: relative;
    width: 480px;
    height: 320px;
    border: 4px solid #2b2b2b;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 2px #8b5e3c;
    cursor: pointer;
    transition: background-color 2s ease;
  }

  /* ===== ゾーン(仮素材:のちに画像に差し替え) ===== */
  .zone {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #2b2b2b;
    border-radius: 4px;
    box-sizing: border-box;
  }
  #zone-desk   { left: 30px;  top: 30px;  width: 140px; height: 110px; background: #cbb994; border: 2px solid #8b5e3c; }
  #zone-sofa   { left: 320px; top: 30px;  width: 130px; height: 90px;  background: #b7c9a8; border: 2px solid #6f8a5c; }
  #zone-bed    { left: 320px; top: 170px; width: 130px; height: 110px; background: #a9b8d1; border: 2px solid #4d5f80; }
  #zone-cage   { left: 30px;  top: 220px; width: 100px; height: 70px;  background: #d8cbb0; border: 2px dashed #8b5e3c; }
  #zone-switch { left: 220px; top: 10px;  width: 40px;  height: 20px;  background: #444; border: 2px solid #222; font-size: 8px; color: #eee; }
  #zone-floor-label { left: 10px; bottom: 6px; font-size: 9px; color: #8b7a63; }

  /* 照明のグロー(仮:黄色い光) */
  .lamp-glow {
    position: absolute;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,216,137,0.9), rgba(255,216,137,0));
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }
  #lamp-desk { left: 78px; top: 55px; }
  #lamp-sofa { left: 362px; top: 55px; }

  /* ===== 主人公キャラクター ===== */
  #character {
    position: absolute;
    width: 16px;
    height: 16px;
    background: #d97757;
    border: 2px solid #2b2b2b;
    border-radius: 3px;
    transition: left 0.9s linear, top 0.9s linear;
    z-index: 5;
  }

  /* ===== 追加キャラクター(仮素材:静止プレースホルダー) ===== */
  .npc {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid #2b2b2b;
    border-radius: 3px;
    z-index: 4;
    font-size: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2b2b2b;
  }
  #npc-woman { left: 355px; top: 55px; background: #e8b4d8; transition: left 1.4s linear, top 1.4s linear; cursor: pointer; }
  #npc-cat   { left: 60px;  top: 245px; background: #f0d060; border-radius: 50%; transition: left 1s linear, top 1s linear; cursor: pointer; }
  #npc-snake { left: 65px;  top: 255px; background: #7fae6a; width: 30px; height: 8px; border-radius: 6px; transition: left 1.6s linear, top 1.6s linear; cursor: pointer; }

  /* ===== 吹き出し ===== */
  #speech-bubble {
    position: absolute;
    background: #fdf8f0;
    color: #2b2b2b;
    border: 2px solid #2b2b2b;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 10px;
    white-space: nowrap;
    display: none;
    z-index: 6;
  }

  /* ===== ツールチップ(特定ゾーンのみ) ===== */
  #tooltip {
    position: absolute;
    background: #2b2b2b;
    color: #fdf8f0;
    padding: 3px 8px;
    font-size: 9px;
    border-radius: 4px;
    pointer-events: none;
    display: none;
    z-index: 7;
  }
</style>
</head>
<body>

<h1>TINY OFFICE — DEMO</h1>

<div class="buttons">
  <button onclick="logAction('wakeup')">☀️ Wake up</button>
  <button class="work" onclick="goToWork()">💼 作業</button>
  <button onclick="logAction('break')">☕ Break</button>
  <button onclick="logAction('sleep')">🛌 Sleep</button>
</div>

<div id="scene">
  <div id="zone-desk" class="zone">DESK (work)</div>
  <div id="zone-sofa" class="zone">SOFA (break)</div>
  <div id="zone-bed" class="zone">BED (sleep)</div>
  <div id="zone-cage" class="zone">CAGE</div>
  <div id="zone-switch" class="zone">SW</div>
  <div id="zone-floor-label">click anywhere to walk</div>

  <div class="lamp-glow" id="lamp-desk"></div>
  <div class="lamp-glow" id="lamp-sofa"></div>

  <div class="npc" id="npc-woman" title="同居人(仮)">女</div>
  <div class="npc" id="npc-cat" title="猫(仮)"></div>
  <div class="npc" id="npc-snake" title="蛇(ケージ内・仮)"></div>

  <div id="character"></div>
  <div id="speech-bubble"></div>
  <div id="tooltip"></div>
</div>

<script>
  const scene = document.getElementById('scene');
  const character = document.getElementById('character');
  const bubble = document.getElementById('speech-bubble');
  const tooltip = document.getElementById('tooltip');

  // ここをCloudflare WorkerのURLに書き換えてください
  const WORKER_URL = "virtual-office-log.rudywarrior-oct24.workers.dev";

  // ここを実際のNotionページURLに書き換えてください
  const JOURNAL_URL = "https://www.notion.so/xxxxxのジャーナルページID";
  const WORK_URL  = "https://www.notion.so/301f58a616bd80d69b85ea18a1eea523";

  // ---------- 状態ごとの目的地とセリフ ----------
  const SPOTS = {
    wakeup: { x: 90,  y: 75,  message: "今日もがんばろう" },
    break:  { x: 375, y: 65,  message: "ちょっと休憩" },
    sleep:  { x: 375, y: 215, message: "おやすみ..." },
    work:   { x: 90,  y: 100, message: "よし、やるか" },
    switch: { x: 232, y: 32,  message: null },
  };

  function showSpeech(x, y, message) {
    bubble.textContent = message;
    bubble.style.left = (x - 10) + "px";
    bubble.style.top  = (y - 26) + "px";
    bubble.style.display = "block";
    clearTimeout(bubble._t);
    bubble._t = setTimeout(() => { bubble.style.display = "none"; }, 2500);
  }

  function moveCharacterTo(x, y, message) {
    character.style.left = x + "px";
    character.style.top  = y + "px";
    if (message) showSpeech(x, y, message);
  }

  // ---------- ボタン操作 ----------
  async function logAction(action) {
    const spot = SPOTS[action];
    if (spot) moveCharacterTo(spot.x, spot.y, spot.message);

    if (action === 'wakeup') {
      setTimeout(() => window.open(JOURNAL_URL, "_blank"), 900);
    }

    // Notion(logDB/ActionDB)への書き込みはこれまで通り
    // try {
    //   await fetch(`${WORKER_URL}/log`, {
    //     method: "POST",
    //     headers: { "Content-Type": "application/json" },
    //     body: JSON.stringify({ action }),
    //   });
    // } catch (e) { console.error(e); }
  }

  function goToWork() {
    moveCharacterTo(SPOTS.work.x, SPOTS.work.y, SPOTS.work.message);
    setTimeout(() => window.open(ACTION_URL, "_blank"), 900);
  }

  // ---------- クリックでの自由移動 + 特定ゾーンだけ説明あり ----------
  const NAV_ZONES = [
    {
      el: document.getElementById('zone-desk'),
      label: "Actionページに移動",
      onClick: () => window.open(ACTION_URL, "_blank"),
    }
  ];

  scene.addEventListener('mousemove', (e) => {
    const rect = scene.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const hit = NAV_ZONES.find(z => {
      const r = z.el.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX <= r.right &&
             e.clientY >= r.top  && e.clientY <= r.bottom;
    });

    if (hit) {
      tooltip.textContent = hit.label;
      tooltip.style.left = (x + 12) + "px";
      tooltip.style.top  = (y - 10) + "px";
      tooltip.style.display = "block";
      scene.style.cursor = "pointer";
    } else {
      tooltip.style.display = "none";
    }
  });

  scene.addEventListener('click', (e) => {
    const rect = scene.getBoundingClientRect();
    const x = e.clientX - rect.left - 8;
    const y = e.clientY - rect.top - 8;

    const hit = NAV_ZONES.find(z => {
      const r = z.el.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX <= r.right &&
             e.clientY >= r.top  && e.clientY <= r.bottom;
    });

    if (hit) {
      moveCharacterTo(x, y, null);
      setTimeout(hit.onClick, 900);
    } else {
      moveCharacterTo(x, y, null);
    }
  });

  // ---------- 実時刻に連動した時間帯の演出 ----------
  const DAY_SKY   = "#bcd6e8";
  const DUSK_SKY  = "#e0a35c";
  const NIGHT_SKY = "#1b2a4a";

  let lightsOn = null; // 初回判定用にnullで開始

  function isDarkHour(hour) {
    return hour < 6 || hour >= 19;
  }

  function updateSkyColor(hour) {
    let bg;
    if (hour >= 6 && hour < 17) bg = DAY_SKY;
    else if (hour >= 17 && hour < 19) bg = DUSK_SKY;
    else bg = NIGHT_SKY;
    scene.style.backgroundColor = bg;
  }

  function setLampGlow(on) {
    document.getElementById('lamp-desk').style.opacity = on ? 1 : 0;
    document.getElementById('lamp-sofa').style.opacity = on ? 1 : 0;
  }

  // 朝/夜の切り替わりで、キャラがスイッチまで歩いて電気をつける/消す
  function performLightToggle(turnOn) {
    moveCharacterTo(SPOTS.switch.x, SPOTS.switch.y, turnOn ? "電気をつけよう" : "電気を消そう");
    setTimeout(() => setLampGlow(turnOn), 900);

    // 電気を消す(=夜になる)タイミングでNPCも寝床へ、電気をつける(=朝)でNPCも起こす
    if (typeof putNpcsToSleep === 'function') {
      if (!turnOn) putNpcsToSleep();
      else wakeNpcsUp();
    }
  }

  function tickRealClock() {
    const hour = new Date().getHours();
    updateSkyColor(hour);
    const dark = isDarkHour(hour);

    if (lightsOn === null) {
      lightsOn = dark; // 初回読み込みはアニメーションなしで反映
      setLampGlow(lightsOn);
    } else if (dark !== lightsOn) {
      performLightToggle(dark);
      lightsOn = dark;
    }
  }

  tickRealClock();
  setInterval(tickRealClock, 60 * 1000); // 1分ごとに実時刻をチェック

  // 初期位置
  moveCharacterTo(SPOTS.wakeup.x, SPOTS.wakeup.y, null);

  // ---------- NPC(女性・猫・蛇)の自由行動 ----------
  let npcsAwake = !lightsOn; // 起動時点の昼夜判定に合わせる

  const NPCS = [
    {
      el: document.getElementById('npc-woman'),
      sleepSpot: { x: 390, y: 200 },
      lines: ["おかえりー", "今日もお疲れさま", "そろそろ休憩しない?", "何か手伝おうか?"],
      wanderMs: [3000, 6000],
    },
    {
      el: document.getElementById('npc-cat'),
      sleepSpot: { x: 55, y: 255 },
      lines: ["にゃー", "ゴロゴロ...", "にゃおん", "(しっぽをゆらす)"],
      wanderMs: [2000, 4500],
    },
    {
      el: document.getElementById('npc-snake'),
      sleepSpot: { x: 60, y: 250 },
      lines: null, // クリックしても何も話さない
      wanderMs: [3500, 7000],
    },
  ];

  function randomFloorPoint() {
    // シーン(480x320)の中で、歩かせても不自然になりにくい範囲
    return {
      x: 24 + Math.random() * (480 - 48),
      y: 40 + Math.random() * (320 - 70),
    };
  }

  function moveNpcTo(npc, x, y) {
    npc.el.style.left = x + "px";
    npc.el.style.top  = y + "px";
  }

  function scheduleWander(npc) {
    const [min, max] = npc.wanderMs;
    const delay = min + Math.random() * (max - min);
    clearTimeout(npc._timer);
    npc._timer = setTimeout(() => {
      if (npcsAwake) {
        const p = randomFloorPoint();
        moveNpcTo(npc, p.x, p.y);
      }
      scheduleWander(npc);
    }, delay);
  }

  function putNpcsToSleep() {
    npcsAwake = false;
    NPCS.forEach(npc => moveNpcTo(npc, npc.sleepSpot.x, npc.sleepSpot.y));
  }

  function wakeNpcsUp() {
    npcsAwake = true; // 次回のscheduleWanderのタイミングで自然に動き出す
  }

  NPCS.forEach(npc => {
    npc.el.addEventListener('click', (e) => {
      e.stopPropagation(); // プレイヤーキャラの移動が誤発火しないように
      const x = parseFloat(npc.el.style.left);
      const y = parseFloat(npc.el.style.top);

      if (!npcsAwake) {
        showSpeech(x, y, "Zzz...");
        return;
      }
      if (npc.lines) {
        const line = npc.lines[Math.floor(Math.random() * npc.lines.length)];
        showSpeech(x, y, line);
      }
      // linesがnull(蛇)の場合は何も反応しない
    });
    scheduleWander(npc);
  });

  // ---------- 今後の拡張予定(足場のみ) ----------
  // ルーティンごとの自動アクション:
  // 例) 決まった時刻になったら logAction('wakeup') を自動で呼ぶ、
  //     ActionDBのルーティン項目を見て自動で該当ゾーンへ移動する、等
  // function checkRoutines() {
  //   const now = new Date();
  //   // ここでNotionのルーティンDBを参照し、時刻が一致したらlogAction()等を呼ぶ
  // }
  // setInterval(checkRoutines, 60 * 1000);
</script>

</body>
</html>
